
name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -o ArquivoFicticioAndroid_projeto.zip

      - name: Compilar APK
        run: gradle -p ArquivoFicticioAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: arquivo-ficticio-apk
          path: ArquivoFicticioAndroid/app/build/outputs/apk/debug/*.apk

